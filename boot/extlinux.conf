# Read by lk2nd from the ext2 file system on the cache partition
#
# root: the userdata partition.  clk_ignore_unused and
# lk2nd.pass-simplefb keep the display that lk2nd turned on;
# fbcon=rotate:3 turns the console like the panel is mounted.
default j1

label j1
    kernel /zImage
    fdt /snapmakerj1.dtb
    append root=PARTLABEL=userdata rootfstype=ext4 rootwait rw quiet loglevel=3 console=tty1 vt.global_cursor_default=0 clk_ignore_unused lk2nd.pass-simplefb=autorefresh 8250.nr_uarts=0 fbcon=rotate:3 firmware_class.path=/firmware/image
