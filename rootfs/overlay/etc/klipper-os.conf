# Settings of KlipperSnapmakerJ1-os, read at boot

# The panel is 720x1280 portrait and mounted in landscape.  X rotates the
# picture: CW or CCW.  The stock system sets persist.panel.orientation=270;
# if the screen of the first boot is upside down, use the other value.
ROTATION=CW

# Rotation of the touch coordinates: same as ROTATION unless the touch
# controller already reports landscape coordinates (NONE, CW, CCW, UD)
TOUCH_ROTATION=SAME

# Backlight brightness 1-255
BACKLIGHT=200

# Touch input device: first input device whose name contains this text
# (case insensitive); the stock driver registers "Goodix-CTP"
TOUCH_MATCH=goodix

# USB network for setup and rescue (RNDIS gadget, this side's address)
USB_NETWORK=yes
USB_ADDRESS=192.168.42.1
