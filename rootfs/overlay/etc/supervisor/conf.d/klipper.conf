; Klipper, Moonraker and KlipperScreen of KlipperSnapmakerJ1-os
;
; supervisord replaces systemd (the stock kernel cannot run it); Moonraker
; manages these programs through supervisorctl ([machine] provider:
; supervisord_cli).

[program:klipper]
command=/home/pi/klippy-env/bin/python /home/pi/klipper/klippy/klippy.py
    /home/pi/printer_data/config/printer.cfg
    -I /home/pi/printer_data/comms/klippy.serial
    -l /home/pi/printer_data/logs/klippy.log
    -a /home/pi/printer_data/comms/klippy.sock
user=pi
environment=HOME="/home/pi",USER="pi"
priority=100
autorestart=true
stopasgroup=true
stdout_logfile=/var/log/supervisor/klipper.out

[program:moonraker]
command=/home/pi/moonraker-env/bin/python /home/pi/moonraker/moonraker/moonraker.py
    -d /home/pi/printer_data
user=pi
environment=HOME="/home/pi",USER="pi"
priority=200
autorestart=true
stopasgroup=true
stdout_logfile=/var/log/supervisor/moonraker.out

[program:KlipperScreen]
command=/usr/bin/xinit /home/pi/.KlipperScreen-env/bin/python
    /home/pi/KlipperScreen/screen.py -- :0 vt7 -nolisten tcp -nocursor
user=pi
environment=HOME="/home/pi",USER="pi"
directory=/home/pi/KlipperScreen
priority=300
autorestart=true
stopasgroup=true
killasgroup=true
stdout_logfile=/var/log/supervisor/KlipperScreen.out
