# mdev rules of KlipperSnapmakerJ1-os (the stock kernel has no devtmpfs)
#
# <device regex> <user>:<group> <mode> [=path] [@|$|*command]

null        root:root 666
zero        root:root 666
full        root:root 666
random      root:root 444
urandom     root:root 444
tty         root:tty  666
tty[0-9]*   root:tty  660
ptmx        root:tty  666
kmsg        root:root 640
console     root:tty  600

# Display and touch screen (X runs through the Xorg wrapper)
fb[0-9]*    root:video 660
input/.*    root:input 660

# Main controller link and the other UARTs of the SC20-W
ttyHSL[0-9]* root:dialout 660

# WLAN control of the WCNSS (pronto) core
wcnss_.*    root:netdev 660

mmcblk[0-9]*.* root:disk 660
loop[0-9]*  root:disk 660
